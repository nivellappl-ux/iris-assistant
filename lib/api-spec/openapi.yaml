openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: iris
    description: Private conversational endpoints for the IRIS assistant
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /iris/chat:
    post:
      operationId: irisChat
      tags: [iris]
      summary: Generate an open-ended IRIS response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IrisChatInput"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantChatReply"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrisError"
        "429":
          description: Request limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrisError"
        "403":
          description: Request origin is not trusted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrisError"
        "402":
          description: AI provider account has exhausted its usage quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrisError"
        "502":
          description: AI provider request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrisError"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrisError"
  /iris/speech:
    post:
      operationId: irisSpeech
      tags: [iris]
      summary: Synthesize a short IRIS voice response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IrisSpeechInput"
      responses:
        "200":
          description: Nova audio or a directive to use browser speech in mock mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSpeechResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrisError"
        "429":
          description: Request limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrisError"
        "403":
          description: Request origin is not trusted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrisError"
        "402":
          description: AI provider account has exhausted its usage quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrisError"
        "502":
          description: AI provider request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrisError"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrisError"
  /iris/livekit/token:
    post:
      operationId: irisLivekitToken
      tags: [iris]
      summary: Issue a short-lived development LiveKit room token
      responses:
        "200":
          description: Temporary LiveKit room credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrisLiveKitToken"
        "403":
          description: Voice token endpoint is restricted to trusted development origins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrisError"
        "429":
          description: Request limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrisError"
        "503":
          description: LiveKit is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrisError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    IrisChatMessageInput:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000
      required: [role, content]
    IrisChatInput:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
        history:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/IrisChatMessageInput"
      required: [message]
    AssistantChatReply:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 20000
      required: [text]
    IrisSpeechInput:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1400
      required: [text]
    AssistantSpeechResponse:
      oneOf:
        - $ref: "#/components/schemas/AssistantSpeechAudio"
        - $ref: "#/components/schemas/AssistantBrowserSpeech"
      discriminator:
        propertyName: mode
    AssistantSpeechAudio:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [audio]
        audioBase64:
          type: string
        mimeType:
          type: string
          enum: [audio/mpeg]
      required: [mode, audioBase64, mimeType]
    AssistantBrowserSpeech:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [browser]
      required: [mode]
    IrisLiveKitToken:
      type: object
      additionalProperties: false
      properties:
        serverUrl:
          type: string
          format: uri
        participantToken:
          type: string
        roomName:
          type: string
      required: [serverUrl, participantToken, roomName]
    IrisError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
      required: [error]

